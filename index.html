<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="5 個小步驟，整理台南買房的生活圈、舒服預算與優先條件。免留資料，直接看你的找房清單。">
  <title>台南小魏｜買房方向診斷</title>
  <link rel="stylesheet" href="./assets/styles.css?v=20260906-r2">
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <main class="app-shell" id="app">
    <header class="brand-bar">
      <a class="brand" href="./" aria-label="回到買房方向診斷首頁">
        <span class="brand-mark" aria-hidden="true">家</span>
        <span class="brand-copy"><strong>台南小魏</strong><small>買厝作伙</small></span>
      </a>
      <span class="privacy-chip"><span aria-hidden="true">✓</span> 台南買房，先有方向</span>
    </header>
    <section class="hero" id="hero"></section>
    <section class="wizard" id="wizard" hidden aria-label="買房方向診斷問卷">
      <div class="progress-row">
        <span id="progressText"></span>
        <div class="progress-track" role="progressbar" aria-label="問卷完成進度" aria-valuemin="1" aria-valuemax="5" aria-valuenow="1">
          <i id="progressBar"></i>
        </div>
      </div>
      <div id="questionArea" aria-live="polite"></div>
      <div class="form-error" id="formError" role="alert" tabindex="-1"></div>
      <nav class="wizard-actions" aria-label="問卷操作">
        <button class="secondary" id="backButton" type="button">上一步</button>
        <button id="nextButton" type="button">下一題</button>
      </nav>
    </section>
    <section class="result" id="resultArea" hidden aria-label="買房方向診斷結果"></section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./src/app.js?v=20260906-r2"></script>
</body>
</html>
